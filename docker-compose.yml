# Full Stigvidd stack: PostgreSQL (with PostGIS), the .NET backend API and the
# Vite web frontend. Designed to be portable — `docker compose up -d --build`
# brings the whole thing up on any host. Copy `.env.example` to `.env` and
# adjust the values before the first run.

name: stigvidd

# Container log retention. EVERY service below references this anchor, and the
# reason it is not merely housekeeping is that the privacy policy commits to a
# number: "Serverloggar: 7 dagar" (web/public/privacy-policy/index.html, §5, both
# languages). Container logs are personal data — `db` runs with log_connections=on
# against a publicly published 5432, so every connection attempt lands here with
# its source IP.
#
# THE TRAP: json-file (and `local`) have NO time-based retention. max-size and
# max-file bound DISK, not AGE — a quiet service keeps its oldest line forever,
# and the driver's default is no rotation at all. So the caps below are only half
# the promise; the other half is scripts/container-log-retention.sh, run daily by
# a systemd timer on the host (DEPLOYMENT.md Part 1). Removing that timer does not
# break anything visibly — it just makes a published legal document false.
# See docs/notes/json-file-has-no-time-retention.md.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # PostGIS is required — the EF migrations create the `postgis` extension.
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    logging: *default-logging
    # PUBLISHED TO THE INTERNET, deliberately, so external clients (pgAdmin) can
    # connect to <host>:5432. Everything then rests on Postgres' own auth: every
    # `host` connection is scram-sha-256, and TLS is switched on below so queries
    # and results are not cleartext. Note this instance also holds Keycloak's
    # database — see "Direct database access" in DEPLOYMENT.md before changing it.
    ports:
      - "${DB_PUBLIC_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stigvidd}
      POSTGRES_USER: ${POSTGRES_USER:-stigvidd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    # ssl=on makes Postgres REFUSE TO START if the two files below are missing,
    # so ./db-certs must be populated (scripts/db-cert.sh) before the first
    # `up -d db`. log_connections/log_disconnections put every attempt —
    # including the brute-force traffic a public 5432 attracts — in the logs.
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/postgresql/certs/server.crt
      -c ssl_key_file=/etc/postgresql/certs/server.key
      -c log_connections=on
      -c log_disconnections=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first init (empty data dir); guarantees the extension is
      # present. Migrations also create it, so this is belt-and-suspenders.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Server cert + key. Bind mount, not a volume: holds a private key, is
      # gitignored, and is carried by hand between hosts like mail-config/.
      - ./db-certs:/etc/postgresql/certs:ro
    networks:
      # `internal` stays the path api/keycloak use — Host=db still resolves here.
      - internal
      # And `dbedge` exists only so the published port above is reachable: a
      # container whose *only* network is `internal: true` binds the host port
      # and then has the forwarded packet dropped by Docker's isolation rules.
      # libnetwork orders a container's endpoints non-internal-first, so this is
      # the endpoint the published port is DNAT'd to. See "5432 is open but
      # connections are refused" in DEPLOYMENT.md's Troubleshooting.
      - dbedge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stigvidd} -d ${POSTGRES_DB:-stigvidd}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    # CI builds & pushes this tag; the deploy host pulls it. REGISTRY/IMAGE_TAG
    # come from the environment (or .env), defaulting to a local build.
    image: ${REGISTRY:-stigvidd}/stigvidd-api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      media:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Npgsql connection string consumed as ConnectionStrings:StigVidd.
      ConnectionStrings__StigVidd: "Host=db;Port=5432;Database=${POSTGRES_DB:-stigvidd};Username=${POSTGRES_USER:-stigvidd};Password=${POSTGRES_PASSWORD}"
      # Media/WebDAV: the API uploads here over the internal network...
      WebDav__BaseUrl: "http://media/"
      WebDav__Username: ${WEBDAV_USER:?WEBDAV_USER must be set}
      WebDav__Password: ${WEBDAV_PASSWORD:?WEBDAV_PASSWORD must be set}
      # ...and hands clients this public base to read them back. Must be a URL
      # the browser/app can reach the media service on (see .env.example).
      PresentableBaseUrl: ${PRESENTABLE_BASE_URL:?PRESENTABLE_BASE_URL must be set}
      # Point auth at the self-hosted Keycloak (overrides appsettings.json).
      # Must be the PUBLIC issuer URL — token `iss` is validated against it. The
      # proxy's network alias makes this resolve internally with a valid cert.
      Keycloak__auth-server-url: ${KEYCLOAK_URL:?KEYCLOAK_URL must be set}
      KeycloakAdminClient__auth-server-url: ${KEYCLOAK_URL}
      # The realm, which appsettings.json otherwise pins to "stigvidd" for BOTH
      # sections. Overriding it here is what lets a second environment point at
      # the same Keycloak and a different realm — a staging stack borrowing
      # production's identity provider. AddKeycloakWebApiAuthentication binds the
      # whole `Keycloak` section, and KeycloakAdminRepository reads Keycloak:realm
      # (that section, not KeycloakAdminClient's), so both must move together or
      # tokens validate against one realm while admin calls hit the other.
      # Defaulted, so an .env that never mentions it behaves exactly as before.
      # See docs/notes/keycloak-realm-lives-in-appsettings-not-compose.md.
      Keycloak__realm: ${KEYCLOAK_REALM:-stigvidd}
      KeycloakAdminClient__realm: ${KEYCLOAK_REALM:-stigvidd}
      # Secret of the confidential `stigvidd-admin-api` client, from its Credentials
      # tab in the realm. Mints the client-credentials token behind
      # IKeycloakAdminRepository, so registration, forgot-password and admin user
      # provisioning all fail at runtime without it. Deliberately NOT in
      # appsettings.json — it is a real credential, and appsettings.json is public.
      KeycloakAdminClient__credentials__secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be set}
      # Name of Keycloak's database (same Postgres) — used by admin export/import.
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      # Outbound mail via the `mailserver` service. Nothing in the API sends mail
      # yet (the only email path is Keycloak's password-reset action email), but
      # wiring it here means the sending code needs no compose change. Host is
      # the mail server's network alias, so STARTTLS matches its certificate.
      Smtp__Host: ${MAIL_DOMAIN:?MAIL_DOMAIN must be set}
      Smtp__Port: "587"
      Smtp__User: ${SMTP_NOREPLY_USER:-no-reply@stigvidd.se}
      Smtp__Password: ${SMTP_NOREPLY_PASSWORD:-}
      Smtp__From: ${SMTP_NOREPLY_USER:-no-reply@stigvidd.se}
      # ---- Telemetry (OpenObserve) ----------------------------------------
      # OPT-IN. Leave OTLP_ENDPOINT unset and the API registers no OpenTelemetry
      # providers at all — identical behaviour to before this block existed. The
      # `:-` (empty default, not `:?`) form is what makes that possible, and
      # matches how VITE_* is handled for `web`: an observability outage, or no
      # observability at all, must never stop the API from starting.
      #
      # Set them as a SET, though. OTLP_ENDPOINT with empty credentials is a
      # misconfiguration rather than "telemetry off", and the API fails fast on it
      # instead of exporting into a 401 forever — see .env.example.
      #
      # In-stack plaintext over the `public` docker network: no proxy hop, no
      # certificate, no hairpin, no TLS cost on a per-span path. No signal path
      # either — the exporter appends /v1/logs, /v1/traces and /v1/metrics itself.
      Otlp__Endpoint: ${OTLP_ENDPOINT:-}
      # The api@ account's INGESTION TOKEN, copied verbatim from OpenObserve's
      # Ingestion page — it is already base64("user:passcode") and is passed
      # straight through, which also avoids the OTEL_EXPORTER_OTLP_HEADERS
      # percent-encoding trap in the .NET SDK.
      #
      # NEVER a login password, and never root: OpenObserve OSS has no RBAC, so a
      # password is not a scoped ingest credential — it reads every stream and
      # creates admin users. See docs/notes/openobserve-oss-has-no-rbac.md.
      Otlp__Token: ${OTLP_TOKEN:-}
      # Legacy fallback for a local throwaway instance; Otlp__Token wins over it.
      Otlp__Username: ${OTLP_USER:-}
      Otlp__Password: ${OTLP_PASSWORD:-}
      # Log stream inside the org. Traces and metrics have their own stores.
      Otlp__LogStream: ${OTLP_LOG_STREAM:-stigvidd_api_logs}
      # Reported as the resource attribute service.version. IMAGE_TAG is the
      # git-derived tag Jenkins builds and deploys with, so a span points at an
      # exact commit with no Dockerfile or build-arg plumbing.
      Otlp__ServiceVersion: ${IMAGE_TAG:-latest}
      # Uploaded trail-import source files. On a volume because a session is
      # re-analysed from the file it was created from, days after the upload.
      TrailImport__StoragePath: /app/trail-imports
    # Liveness, not readiness: /readyz would flip to unhealthy on a database blip, and
    # nothing acts on `unhealthy` here anyway (compose does not restart on it, and no
    # service depends_on api). curl is already in the runtime image — the Dockerfile
    # installs it for the PGDG repo setup and does not purge it. start_period covers the
    # EF migrations the API runs before it starts serving.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    volumes:
      - trail_imports:/app/trail-imports
    # No host ports — the proxy is the only ingress. Reachable as `api:8080`
    # on the `public` network.
    networks:
      - internal   # reach the database + media
      - public     # reach Keycloak / the internet + the proxy

  web:
    image: ${REGISTRY:-stigvidd}/stigvidd-web:${IMAGE_TAG:-latest}
    build:
      context: ./web
      args:
        # Baked into the static bundle at build time — see .env.example.
        # `:-` defaults keep `compose pull`/`up` on the deploy host (which does
        # not build) quiet even when these are unset there.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_OIDC_URL: ${VITE_OIDC_URL:-}
        VITE_OIDC_REALM: ${VITE_OIDC_REALM:-}
        VITE_CLIENT_ID: ${VITE_CLIENT_ID:-}
        # Telemetry, optional — unset means the bundle installs no log sink.
        # `:-` soft refs, so ci/build.env needs no placeholder for these.
        VITE_OO_LOGS_URL: ${VITE_OO_LOGS_URL:-}
        VITE_OO_LOGS_TOKEN: ${VITE_OO_LOGS_TOKEN:-}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    # Served by the proxy as `web:80` on the `public` network.
    networks:
      - public

  media:
    # WebDAV media server (nginx). API writes here (basic auth); browsers read
    # (public). Data lives in the `media` volume — part of the migration path.
    image: ${REGISTRY:-stigvidd}/stigvidd-media:${IMAGE_TAG:-latest}
    build:
      context: ./media
    restart: unless-stopped
    logging: *default-logging
    environment:
      WEBDAV_USER: ${WEBDAV_USER:?WEBDAV_USER must be set}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD:?WEBDAV_PASSWORD must be set}
    volumes:
      - media:/data
    # No host ports — public reads come via the proxy (media.<domain>); API
    # uploads come over the internal network.
    networks:
      - internal   # API uploads over the internal network
      - public     # public reads via the proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  keycloak:
    # Self-hosted identity provider at auth.<domain>. Uses a dedicated
    # `keycloak` database in the app's Postgres, so its data rides along with
    # the pgdata migration. TLS is terminated at the proxy.
    image: ${REGISTRY:-stigvidd}/stigvidd-keycloak:${IMAGE_TAG:-latest}
    build:
      context: ./keycloak
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-stigvidd}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Public base URL — issuer + redirect URLs are built from this.
      KC_HOSTNAME: ${KEYCLOAK_URL:?KEYCLOAK_URL must be set}
      KC_HTTP_ENABLED: "true"          # TLS is terminated at the proxy
      KC_PROXY_HEADERS: xforwarded     # trust X-Forwarded-* from the proxy
      # (KC_HEALTH_ENABLED is a build-time option — baked into the image.)
      # First-boot admin bootstrap (change/rotate after first login).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?KC_ADMIN_USER must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?KC_ADMIN_PASSWORD must be set}
    networks:
      - internal   # reach the database
      - public     # be reachable from the proxy

  openobserve:
    # Telemetry store at observatory.<domain>: logs, traces and metrics from the
    # API over OTLP, plus logs/errors and RUM posted straight from the mobile
    # apps over the public internet. TLS is terminated at the proxy.
    #
    # Upstream image — unlike api/web/media/proxy/keycloak there is nothing to
    # build, so it is NOT in the Jenkins build/push set, and (same reasoning as
    # `db` and `mailserver`) not in its pull/up set either: it holds live data in
    # a volume, so bumping the tag below is a deliberate, manual
    # `docker compose up -d openobserve` on the host. See DEPLOYMENT.md Part 3.
    image: public.ecr.aws/zinclabs/openobserve:v0.92.2
    restart: unless-stopped
    logging: *default-logging
    # No depends_on, in either direction. Telemetry must never gate the API's
    # startup — an observability outage taking down the product is exactly the
    # failure this avoids — and Caddy resolves upstreams lazily, so it 502s until
    # this is up rather than failing to load its config.
    #
    # Note this does NOT use the app's Postgres: in single-node mode the metadata
    # store (users, ingest tokens, stream settings) is a SQLite file inside
    # ZO_DATA_DIR, so none of it rides along with the pgdata migration the way
    # Keycloak's realm does.
    environment:
      # First-boot root account, created only while the data volume is empty.
      # Changing these later does nothing — rotate in the UI instead.
      ZO_ROOT_USER_EMAIL: ${OBSERVATORY_ROOT_EMAIL:?OBSERVATORY_ROOT_EMAIL must be set}
      ZO_ROOT_USER_PASSWORD: ${OBSERVATORY_ROOT_PASSWORD:?OBSERVATORY_ROOT_PASSWORD must be set}
      # Single node, everything on local disk in the `observatory` volume.
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: disk
      ZO_DATA_DIR: /data
      # Public base URL. Alert notifications and "share this view" links are built
      # from it; leave it unset and they point at localhost:5080.
      ZO_WEB_URL: https://${OBSERVATORY_DOMAIN:?OBSERVATORY_DOMAIN must be set}
      # GLOBAL default retention, and the only one OpenObserve has — there is no
      # per-stream-type setting. 7 days is the policy for logs and traces, the
      # bulky, disposable signals. Metrics are kept for two years via per-stream
      # overrides applied after first boot (scripts/observatory-retention.sh);
      # the global stays low so anything NOT explicitly overridden fails safe —
      # towards a small disk, not a full one. It is also what bounds how long
      # personal data lives, so it is a GDPR control, not just a disk one.
      # (Upstream default here is 3650 days. Minimum accepted value is 3.)
      ZO_COMPACT_DATA_RETENTION_DAYS: ${OBSERVATORY_RETENTION_DAYS:-7}
      # The /rum/* ingest endpoints are off by default — the mobile apps need them.
      ZO_RUM_ENABLED: "true"
      # Phones buffer telemetry while offline and flush when they next get a
      # network. The 5-hour DEFAULT SILENTLY REJECTS anything older than that, so
      # a handset that was off the air overnight loses its whole batch. 48h covers
      # a weekend in a dead zone. ZO_INGEST_ALLOWED_IN_FUTURE stays at its 24h
      # default — that is what absorbs handset clock skew.
      ZO_INGEST_ALLOWED_UPTO: "48"
      # Both of these default to "50% of total memory", read from the HOST when
      # the container has no cgroup limit — i.e. this service would happily
      # reserve half the box and push Postgres into swap. Capping via env rather
      # than mem_limit is deliberate: hitting these makes OpenObserve spill to
      # disk, whereas a cgroup limit OOM-kills it mid-flush.
      ZO_MEM_TABLE_MAX_SIZE: "256"      # MB
      ZO_MEMORY_CACHE_MAX_SIZE: "256"   # MB
      ZO_HTTP_WORKER_NUM: "2"           # default is one worker per CPU core
      # Don't spend our own disk budget storing our own metrics.
      ZO_SELF_METRIC_CONSUMPTION_ENABLED: "false"
      # The web admin is a browser caller and would otherwise be blocked by CORS.
      # Native mobile does not enforce CORS, so this is only about `web`.
      ZO_CORS_ALLOWED_ORIGINS: https://${WEB_DOMAIN}
      # No anonymous phone-home to zinclabs (defaults to true). The rest of this
      # stack is entirely self-hosted, and under GDPR that default would be an
      # outbound transfer of data to a US processor — so this is not optional.
      ZO_TELEMETRY: "false"
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - observatory:/data
    # No host ports — the proxy is the only ingress, exactly as for api/web.
    #
    # Deliberately NO healthcheck: the published image is distroless (its final
    # layer is just the `openobserve` binary and three .so files), so there is no
    # shell, no curl and no wget for a `test:` command to invoke, and both CMD and
    # CMD-SHELL forms would report the container permanently unhealthy. Nothing
    # depends_on it either. Probe from outside instead:
    #   curl -fsS https://observatory.<domain>/healthz   -> {"status":"ok"}
    #
    # `public` only. The proxy lives there and must reach it, and `api` is on BOTH
    # networks so it already resolves this name — adding `internal` buys nothing.
    # Internal-only would be actively wrong: `internal: true` means no egress,
    # cutting off Caddy and any outbound alert delivery.
    networks:
      - public

  proxy:
    # Caddy: TLS termination + automatic Let's Encrypt certs, routing each
    # subdomain to its service. The ONLY service that publishes host ports.
    image: ${REGISTRY:-stigvidd}/stigvidd-proxy:${IMAGE_TAG:-latest}
    build:
      context: ./proxy
    restart: unless-stopped
    logging: *default-logging
    # Which Caddyfile the image runs. Defaults to the full six-site config, so a
    # host that never sets this is unchanged. A partial stack sets
    # CADDYFILE=/etc/caddy/Caddyfile.app to drop the auth/observatory/mail sites,
    # which is what stops Caddy requesting certificates for three names it does
    # not serve. Both files are baked into the image by proxy/Dockerfile.
    command: caddy run --config ${CADDYFILE:-/etc/caddy/Caddyfile} --adapter caddyfile
    # Deliberately NOT depends_on keycloak (nor openobserve): Caddy resolves an
    # upstream lazily, at the first request for that site, so naming them buys
    # no ordering — and it would force a partial stack (see STAGING.md, which
    # runs db/api/web/media/proxy and borrows production's Keycloak) to start a
    # Keycloak it does not want. web/api/media stay: those it always fronts.
    depends_on:
      - web
      - api
      - media
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN must be set}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN must be set}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?MEDIA_DOMAIN must be set}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN must be set}
      # Required (:?) rather than defaulted, deliberately: an unset
      # {$OBSERVATORY_DOMAIN} in the Caddyfile produces an EMPTY site address,
      # which makes Caddy refuse to load its whole config — taking every other
      # domain down with it. Failing loudly at interpolation time is far better.
      OBSERVATORY_DOMAIN: ${OBSERVATORY_DOMAIN:?OBSERVATORY_DOMAIN must be set}
      # Nothing is proxied for MAIL_DOMAIN — the site block exists purely so
      # Caddy issues and renews that certificate for the mailserver to read.
      MAIL_DOMAIN: ${MAIL_DOMAIN:?MAIL_DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
      # Optional: point at LE staging while testing to dodge rate limits.
      # NOTE: the mailserver's SSL_CERT_PATH hard-codes the *production* issuer
      # directory name. Change this and that path must change to match.
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data      # issued certs + ACME account — keep this!
      - caddy_config:/config
    networks:
      public:
        # Make the public hostnames resolve to the proxy from INSIDE the stack,
        # so the API's server-to-server calls to https://auth.<domain> hit Caddy
        # (valid cert) instead of hairpinning out to the public IP.
        #
        # THE TRAP: this is unconditional. Whatever a *_DOMAIN is set to, THIS
        # stack owns that name on the docker network. A stack that borrows
        # another environment's Keycloak/OpenObserve must therefore set these to
        # its OWN hostnames and reach the other environment through KEYCLOAK_URL
        # / OTLP_ENDPOINT, which are not aliased — otherwise it answers its own
        # request with a service it does not run, and curl from the host still
        # works because the host is not on this network.
        # See docs/notes/proxy-aliases-shadow-public-hostnames.md and STAGING.md.
        aliases:
          - ${WEB_DOMAIN}
          - ${API_DOMAIN}
          - ${MEDIA_DOMAIN}
          - ${AUTH_DOMAIN}
          - ${OBSERVATORY_DOMAIN}
          # NOT ${MAIL_DOMAIN} — SMTP/IMAP are not proxied by Caddy. That alias
          # belongs to the `mailserver` service below.

  mailserver:
    # Full mail server (Postfix + Dovecot + Rspamd + Fail2ban) for the domain.
    # Upstream image — unlike the other services there is nothing to build, so
    # it is NOT in the Jenkins pull/up set (same treatment as `db`): bumping the
    # tag below is a manual `docker compose up -d mailserver` on the host.
    image: ghcr.io/docker-mailserver/docker-mailserver:15.1.0
    # Postfix derives myhostname/HELO from this — must be the public mail name.
    hostname: ${MAIL_DOMAIN:?MAIL_DOMAIN must be set}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      # SSL_TYPE=manual refuses to start without the cert files, and Caddy is
      # what issues them. This orders startup only — on a first deploy, give the
      # proxy time to actually obtain the cert (see DEPLOYMENT.md Part 1 step 3).
      - proxy
    environment:
      # ---- Outbound: Hostup smarthost -------------------------------------
      # Hostup blocks outbound port 25, so everything leaves via their relay,
      # which authorises by SOURCE IP (the _hostup.<domain> TXT record), not by
      # credentials. Deliberately no RELAY_USER/RELAY_PASSWORD: setting either
      # switches Postfix into "credentials mandatory" mode and breaks the relay.
      # DEFAULT_RELAY_HOST writes Postfix's `relayhost` directly; the legacy
      # RELAY_HOST goes via sender_dependent_relayhost_maps and is not wanted.
      DEFAULT_RELAY_HOST: "[${MAIL_RELAY_HOST:-relay.hostup.se}]:${MAIL_RELAY_PORT:-587}"
      # ---- TLS: certificates issued and renewed by the proxy (Caddy) ------
      # The whole caddy_data volume is mounted (read-only) rather than the two
      # cert files: a file bind-mount pins an inode, so after renewal the
      # container would go on serving the old certificate. DMS polls these paths
      # and reloads Postfix/Dovecot when they change.
      SSL_TYPE: manual
      SSL_CERT_PATH: /tmp/dms/custom-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MAIL_DOMAIN}/${MAIL_DOMAIN}.crt
      SSL_KEY_PATH: /tmp/dms/custom-certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${MAIL_DOMAIN}/${MAIL_DOMAIN}.key
      # ---- Spam filtering + DKIM ------------------------------------------
      # Rspamd replaces the OpenDKIM/OpenDMARC/Amavis trio and signs outbound
      # DKIM itself. Its Redis starts automatically (ENABLE_RSPAMD_REDIS
      # defaults to ENABLE_RSPAMD) — no separate service needed.
      # Measured idle footprint is ~160MB PSS. Note `docker stats` and a naive
      # RSS sum both read ~1GB here: rspamd runs five workers that share large
      # mmap'd map files, and the sum double-counts them. See DEPLOYMENT.md for
      # a lighter (non-Rspamd) configuration if the host is genuinely tight.
      ENABLE_RSPAMD: "1"
      RSPAMD_LEARN: "1"                # learn from mail moved into/out of Junk
      RSPAMD_GREYLISTING: "1"          # off by default upstream
      RSPAMD_CHECK_AUTHENTICATED: "0"  # don't rescan our own submitted mail
      ENABLE_OPENDKIM: "0"             # upstream default is 1 — Rspamd signs
      ENABLE_OPENDMARC: "0"            # upstream default is 1 — Rspamd validates
      ENABLE_AMAVIS: "0"               # upstream default is 1 — Perl, redundant here
      ENABLE_POLICYD_SPF: "0"          # upstream default is 1 — Rspamd checks SPF
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_CLAMAV: "0"               # signature DB alone is ~850MB and growing
      # Postscreen blocklists: rejects known botnet senders at connect time,
      # before the message body is accepted. Near-zero cost.
      ENABLE_DNSBL: "1"
      POSTSCREEN_ACTION: enforce
      ENABLE_FAIL2BAN: "1"             # port 25 is internet-facing
      ENABLE_IMAP: "1"
      ENABLE_POP3: "0"
      # ---- Submission policy ----------------------------------------------
      PERMIT_DOCKER: none              # no unauthenticated relay from the docker net
      SPOOF_PROTECTION: "1"            # an account may only send as its own address
      POSTMASTER_ADDRESS: ${POSTMASTER_ADDRESS:-postmaster@stigvidd.se}
      ENABLE_UPDATE_CHECK: "0"
      TZ: ${TZ:-Europe/Stockholm}
    ports:
      - "25:25"     # inbound SMTP from the internet (MX target)
      - "465:465"   # submission, implicit TLS
      - "587:587"   # submission, STARTTLS — what Keycloak and the API use
      - "993:993"   # IMAPS
    volumes:
      # Accounts (hashed passwords), aliases and DKIM keys. A bind mount, not a
      # volume, so it can be edited and copied by hand like .env — it is
      # git-ignored and must be carried across a host move.
      - ./mail-config/:/tmp/docker-mailserver/
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - maillogs:/var/log/mail
      # Read-only: the mail server only ever reads certs out of here. Note this
      # also exposes Caddy's ACME account key to this container — an accepted
      # trade, both being our own containers on the same host.
      - caddy_data:/tmp/dms/custom-certs:ro
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN   # fail2ban manipulates iptables
    networks:
      public:
        # Same trick as the proxy above: Keycloak connects to
        # mail.<domain>:587 and gets a name that matches the certificate,
        # without hairpinning out to the public IP.
        aliases:
          - ${MAIL_DOMAIN}

networks:
  # DB <-> API traffic only; no route to the outside world.
  internal:
    internal: true
  # Public-facing + internet egress (frontend, and the API's Keycloak calls).
  public:
  # Exists for one reason: to give `db` a non-internal endpoint so its published
  # 5432 is actually routable. Nothing else joins it, so it is not a general
  # "everything can see the database" network.
  dbedge:

volumes:
  pgdata:
  trail_imports:  # uploaded source exports awaiting review
  media:
  caddy_data:
  caddy_config:
  observatory:   # telemetry (parquet + WAL + OpenObserve's SQLite meta DB)
                 # NOT migrated — same treatment as maillogs. See DEPLOYMENT.md.
  maildata:     # mailboxes — stateful, part of the migration path
  mailstate:    # Rspamd/Redis/fail2ban state that should survive a restart
  maillogs:     # not migrated
