server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The legal pages in public/ are DIRECTORIES (/privacy-policy/index.html), so
    # nginx answers the slashless /privacy-policy with a 301 to the slashed form.
    # By default that Location is absolute and built from $scheme + $host as seen
    # INSIDE the container — i.e. http://, port 80 — which downgrades a visitor
    # who arrived over TLS and sends them back through Caddy's http->https
    # redirect. Relative redirects keep whatever scheme, host and port the client
    # actually used. The app links the slashed form and never hits this; a human
    # typing the URL does.
    # See docs/notes/web-public-is-already-live.md.
    absolute_redirect off;

    # The site is one document with anchor links and no client-side router, so a path
    # that matches no file is a mistake, not a route. =404 says so instead of serving
    # the landing page under a wrong URL with status 200.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Long-lived caching for fingerprinted assets, never for index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Screenshots are not fingerprinted — they are copied verbatim out of public/ —
    # so they get a bounded cache rather than an immutable one.
    location /screenshots/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
