# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # The agent harness in .claude/. Node only, no dotnet and no npm install, so it is the
  # cheapest job here and the one that runs on Windows too -- the hooks' own self-tests
  # assert the Windows-shaped inputs (backslash paths, `$env:` and `set` command prefixes)
  # that are the ones which fail OPEN when mishandled, and this is the repo's only
  # automated Windows coverage.
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
    # Runs every hook's --self-test, asserts each registration resolves to a file and each
    # hook file is registered, requires exec-form registrations, and checks
    # docs/notes/INDEX.md against the files. A note cannot fail a build; a gate can.
    - name: Check hooks
      run: node scripts/check-hooks.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install SpatiaLite
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-mod-spatialite libspatialite-dev
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      env:
        # Host startup requires this; WebApplicationFactory replaces the DbContext
        # with SQLite in-memory, so the value is only there to pass the null-check.
        ConnectionStrings__StigVidd: "DataSource=:memory:"
      run: |
        dotnet test --no-build
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: app/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Prettier check
      run: npm run format:check
    - name: Lint
      run: npm run lint
    - name: Test
      run: npm test -- --watchAll=false

  # web/ was previously built and tested only by the Jenkinsfile, which runs on main and
  # on nothing else -- so a web change could be green on a PR here and broken. This job
  # closes that. It deliberately does NOT duplicate Jenkins' generated-client staleness
  # gate (generate:api followed by git diff --exit-code): that check belongs next to the
  # image build that would ship the stale client, and it is the one step here that would
  # fail for a reason unrelated to the diff under test.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        # Keep in step with web/Dockerfile's build stage and with the app job.
        node-version: 24
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    # Vitest over jsdom, configured in web/vitest.config.ts and NOT in vite.config.ts.
    # The npm script is "vitest run" -- the bare binary watches and never exits.
    # No server and no backend: every call the suite makes is stubbed.
    - name: Test
      run: npm test
    # "tsc -b && vite build" IS the web type check -- Vitest type-checks nothing. The
    # VITE_* vars are inlined at build time and none is set here; that matches the
    # Jenkins Test stage, and an unset one only becomes undefined in the bundle this
    # job throws away.
    - name: Build
      run: npm run build
