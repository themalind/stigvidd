server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The legal pages in public/ are DIRECTORIES (/privacy-policy/index.html), so
    # nginx answers the slashless /privacy-policy with a 301 to the slashed form.
    # By default that Location is absolute and built from $scheme + $host as seen
    # INSIDE the container — i.e. http://, port 80 — which downgrades a visitor
    # who arrived over TLS and sends them back through Caddy's http->https
    # redirect. Relative redirects keep whatever scheme, host and port the client
    # actually used. The app and Play Console link the slashed form and never hit
    # this; a human typing the URL does.
    # See docs/notes/web-public-is-already-live.md.
    absolute_redirect off;

    # SPA history-mode fallback: unknown paths return index.html so the
    # client-side router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for fingerprinted assets, never for index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
